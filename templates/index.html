<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 任务管理系统</h1>

        <!-- 今日推荐歌曲 -->
        <div class="music-card" id="musicCard" style="display:none;">
            <div class="music-cover">
                <img id="songPic" src="" alt="封面">
            </div>
            <div class="music-info">
                <div class="music-label">🎵 今日推荐</div>
                <div class="music-title" id="songName">加载中...</div>
                <div class="music-artist" id="songArtist"></div>
            </div>
            <a id="songLink" class="btn btn-music" href="#" target="_blank">去聆听</a>
        </div>

        <!-- 任务表单 -->
        <div class="task-form">
            <form id="taskForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskTitle">任务标题</label>
                        <input type="text" id="taskTitle" placeholder="请输入任务标题" required>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">分类</label>
                        <select id="taskCategory">
                            <option value="工作">工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">优先级</label>
                        <select id="taskPriority">
                            <option value="高">高</option>
                            <option value="中" selected>中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskDeadline">截止日期</label>
                        <input type="date" id="taskDeadline">
                    </div>
                    <div class="form-group">
                        <label for="taskReminder">提醒时间</label>
                        <input type="datetime-local" id="taskReminder">
                    </div>
                </div>
                <div class="form-row form-row-notes">
                    <div class="form-group form-group-notes">
                        <label for="taskNotes">备注</label>
                        <textarea id="taskNotes" rows="3" placeholder="可以多写点备注..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">添加任务</button>
                </div>
            </form>
        </div>

        <!-- 任务列表 -->
        <div class="task-list">
            <div id="taskList">
                <!-- 任务将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal" style="display:none;">
        <div class="modal">
            <h2>编辑任务</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editTitle">任务标题</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="modal-row">
                    <div class="form-group">
                        <label for="editCategory">分类</label>
                        <select id="editCategory">
                            <option value="工作">工作</option>
                            <option value="学习">学习</option>
                            <option value="生活">生活</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPriority">优先级</label>
                        <select id="editPriority">
                            <option value="高">高</option>
                            <option value="中">中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                </div>
                <div class="modal-row">
                    <div class="form-group">
                        <label for="editDeadline">截止日期</label>
                        <input type="date" id="editDeadline">
                    </div>
                    <div class="form-group">
                        <label for="editReminder">提醒时间</label>
                        <input type="datetime-local" id="editReminder">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editStatus">状态</label>
                    <select id="editStatus">
                        <option value="待完成">待完成</option>
                        <option value="进行中">进行中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editNotes">备注</label>
                    <textarea id="editNotes" rows="4" placeholder="可以多写点备注..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
